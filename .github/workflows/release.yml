name: Release

# Push a tag like v0.1.0 to publish the image, the Helm chart, install.yaml and
# the laptop binaries (clusterview and kubectl-clusterview).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # GitHub release
  packages: write   # image and chart on ghcr.io
  id-token: write   # keyless signing

jobs:
  image-and-chart:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"

      - uses: azure/setup-helm@v5
      - name: Publish chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/clusterview --version "$VERSION" --app-version "$VERSION"
          helm push "clusterview-$VERSION.tgz" "$CHARTS"

  # A job of its own: on the same machine as the multi-arch image build,
  # cross-compiling every binary ran out of disk.
  binaries-and-release:
    needs: image-and-chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from history
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: azure/setup-helm@v5
      - name: Render install.yaml
        run: |
          helm package charts/clusterview --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP"
          {
            printf 'apiVersion: v1\nkind: Namespace\nmetadata:\n  name: clusterview\n---\n'
            helm template clusterview "$RUNNER_TEMP/clusterview-$VERSION.tgz" --namespace clusterview
          } > install.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Binaries and GitHub release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
